# Compila la build WebGL de UPTIME y la publica en GitHub Pages.
#
# La build ya NO se versiona: se compila aquí en cada push que toque el juego. Antes se
# subía Build/WebGL compilada en local, lo que metía ~7 MB de binarios irrecuperables en
# la historia por cada publicación y no garantizaba que la build correspondiera al código.
#
# Requisitos de una sola vez:
#   1. Settings > Pages > Source = GitHub Actions.
#   2. Tres secretos del repo con la licencia de Unity (Settings > Secrets and variables >
#      Actions). Para una licencia Personal:
#         UNITY_EMAIL     el correo de la cuenta de Unity
#         UNITY_PASSWORD  su contraseña
#         UNITY_LICENSE   el contenido del fichero Unity_lic.ulf
#      El .ulf se obtiene con el flujo de activación de GameCI:
#      https://game.ci/docs/github/activation
#
# Para probar sin publicar: "Run workflow" desde la pestaña Actions sobre una rama. El job
# de despliegue solo corre en main, así que en una rama se compila y no se toca el sitio.
name: Desplegar WebGL en Pages

on:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Compilar WebGL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # El paso más caro con diferencia es que Unity importe todo desde cero. Library
      # ronda el giga, así que la clave NO incluye Assets/: cambia en cada push y haría
      # que se guardara una caché nueva de cientos de MB cada vez, agotando el límite del
      # repo para nada. Packages/ y ProjectSettings/ se tocan poco y son lo que de verdad
      # invalida la importación; los cambios en Assets/ los reimporta Unity al vuelo.
      - name: Caché de Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Compilar con Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.0.82f1
          targetPlatform: WebGL
          # El mismo método que usa ./tools/build-web.sh, así que la build de CI y la de
          # local salen de un único sitio: nombres por hash, brotli, plantilla propia.
          buildMethod: ServerGame.EditorTools.BuildTools.BuildWeb
          # unity-builder compone la ruta de salida como <buildsPath>/<buildName> y se la
          # pasa a Unity en -customBuildPath, ya absoluta. Estos dos valores la dejan en
          # Build/WebGL, que es donde la buscan los pasos siguientes.
          buildsPath: Build
          buildName: WebGL
          # Sin esto unity-builder intenta versionar por tags de git y falla si no hay.
          versioning: None
          # BuildTools regenera Main.unity al compilar, así que el árbol queda sucio.
          allowDirtyBuild: true

      # Unity corre dentro de Docker como root y deja la salida con ese dueño; sin esto
      # los pasos siguientes no pueden empaquetarla.
      - name: Devolver la propiedad de los ficheros al runner
        run: sudo chown -R "$(id -u):$(id -g)" Build

      - name: Comprobar que la build existe
        run: |
          if [ ! -f Build/WebGL/index.html ]; then
            echo "::error::Unity terminó sin dejar Build/WebGL/index.html."
            ls -laR Build || true
            exit 1
          fi
          du -sh Build/WebGL

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Build/WebGL

  deploy:
    name: Publicar en Pages
    needs: build
    # Solo main publica. Un workflow_dispatch sobre otra rama compila y se queda ahí.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
